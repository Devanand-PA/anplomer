  <circle id="eye2-white" cx="37.5" cy="28" r="4.2" fill="#ffffff"/>
  <circle id="eye2-pupil" cx="39.1" cy="28.4" r="2.1" fill="#2a2118"/>
  <path id="brow" fill="#4a2e1d" d="M 23 25.5 L 30 24.5 L 30 26 L 23 27 Z"/>
