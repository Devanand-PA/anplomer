<?xml version="1.0" encoding="UTF-8"?>
<!-- Anplomer hero: a cheerful little knight. viewBox 64x88, feet at y=88,
     facing right. Part ids drive the baked animation roles: leg-*/shoe-*
     swing as limbs, arm-*/hand-* counter-swing as arms; "scarf"/"plume" are
     mapped to the flutter channel in art/art.json. -->
<svg width="64" height="88" viewBox="0 0 64 88" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <path id="scarf" fill="#e14a4a"
        d="M 24 40 C 16 40 9 45 4 52 C 10 51 14 51 18 49 C 15 55 13 60 12 65 C 20 59 26 50 29 44 Z"/>
  <g id="legs">
    <path id="leg-left"  fill="#2a3f7a" d="M 24 60 L 31 60 L 31 76 Q 31 79 28 79 L 24 79 Z"/>
    <path id="leg-right" fill="#33477f" d="M 33 60 L 40 60 L 40 76 Q 40 79 37 79 L 33 79 Z"/>
  </g>
  <g id="shoes">
    <path id="shoe-left"  fill="#1b243f"
          d="M 21 76 L 32 76 Q 35 76 35 80 L 35 84 Q 35 87 32 87 L 21 87 Q 18 87 18 84 L 18 80 Q 18 76 21 76 Z"/>
    <path id="shoe-right" fill="#232f52"
          d="M 32 76 L 43 76 Q 46 76 46 80 L 46 84 Q 46 87 43 87 L 32 87 Q 29 87 29 84 L 29 80 Q 29 76 32 76 Z"/>
  </g>
  <path id="body" fill="#3f6be0"
        d="M 20 38 Q 32 30 44 38 L 46 58 Q 46 65 39 65 L 25 65 Q 18 65 18 58 Z"/>
  <path id="chest" fill="#5a85f5"
