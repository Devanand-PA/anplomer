    <path id="arm-front" fill="#3f6be0"
          d="M 48 38 Q 53 41 53 47 L 53 56 Q 53 60 49 60 L 45 60 L 45 38 Z"/>
    <circle id="hand-back" cx="15" cy="61" r="4" fill="#f0be92"/>
    <circle id="hand-front" cx="49" cy="61" r="4" fill="#f0be92"/>
  </g>
  <circle id="head" cx="32" cy="23" r="13" fill="#f3c79a"/>
