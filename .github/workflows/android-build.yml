name: Android Build

on:
  push:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # local.properties is a machine-specific developer file; the CI runner
      # provides the Android SDK through ANDROID_HOME instead.
      - name: Remove machine-specific SDK path (if present)
        run: rm -f local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anplomer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
