name: Android Build

on:
  push:

# Writing to GitHub Releases requires contents write on the default
# (read-only) GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK and update release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # local.properties is a machine-specific developer file; the CI runner
      # provides the Android SDK through ANDROID_HOME instead.
      - name: Remove machine-specific SDK path (if present)
        run: rm -f local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anplomer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keeps ONE rolling release tagged "latest" that always matches the most
      # recent push: the tag is re-created at the built commit and the fresh
      # APK attached, so the downloadable source snapshot is the exact code
      # the APK was built from. To only release from the default branch, add
      # `if: github.ref == 'refs/heads/master'` to this step.
      - name: Update the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk anplomer-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "Anplomer — latest build" \
            --notes "Automated build of branch $GITHUB_REF_NAME at commit $GITHUB_SHA." \
            --prerelease \
            anplomer-debug.apk
